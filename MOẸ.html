<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ Lý Giám Thị AI - Tự Động Hóa</title>
    
    <!-- Thư viện CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Font chữ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- File CSS riêng -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="school-bg text-gray-200 min-h-screen flex flex-col items-center p-4">

    <!-- Màn hình đăng nhập -->
    <div id="login-screen" class="fixed inset-0 bg-gray-900 bg-opacity-95 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-500">
        <div class="w-full max-w-md bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
            <div class="text-center mb-8">
                <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/50">
                    <i class="fas fa-shield-alt text-3xl text-white"></i>
                </div>
                <h2 class="text-3xl font-bold text-white">Cổng Giám Thị</h2>
                <p class="text-gray-400 mt-2">Hệ thống ghi nhận vi phạm thông minh</p>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Họ và tên giám thị</label>
                    <input type="text" id="user-name-input" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-gray-500" placeholder="Ví dụ: Nguyễn Văn A">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Ca trực / Lớp</label>
                    <input type="text" id="user-class-input" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-gray-500" placeholder="Ví dụ: Trực sáng T2">
                </div>
                <button id="access-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-lg text-lg transition-all transform hover:scale-[1.02] shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <span>Bắt đầu làm việc</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Nội dung chính -->
    <main class="w-full max-w-7xl mx-auto hidden animate-fade-in transition-all duration-500" id="main-content">
        <header class="flex flex-col md:flex-row justify-between items-center bg-gray-800/80 backdrop-blur-md p-6 rounded-2xl shadow-xl border border-gray-700 mb-6">
            <div class="mb-4 md:mb-0">
                <h1 class="text-2xl md:text-3xl font-bold text-white flex items-center gap-3">
                    <i class="fas fa-clipboard-check text-green-500"></i>
                    Xử Lý Vi Phạm
                </h1>
                <p class="text-gray-400 mt-1 text-sm"><i class="fas fa-user-clock mr-2"></i>Giám thị: <span id="display-user-name" class="text-white font-semibold">...</span> | <span id="display-user-class">...</span></p>
            </div>
            <div class="flex gap-3">
                 <button onclick="window.location.reload()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    <i class="fas fa-sign-out-alt mr-2"></i>Thoát
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Cột Trái: Nhập liệu (chiếm 5 phần) -->
            <div class="lg:col-span-5 space-y-6">
                
                <!-- Card Nhập liệu thông minh -->
                <div class="bg-gray-800/80 backdrop-blur-sm p-6 rounded-2xl shadow-xl border border-gray-700 h-full flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-white flex items-center gap-2">
                            <i class="fas fa-keyboard text-blue-400"></i> Nhập Nhanh
                        </h2>
                        <div class="flex gap-2">
                             <button id="mic-btn" class="bg-gray-700 hover:bg-gray-600 text-gray-200 p-2 rounded-full w-10 h-10 flex items-center justify-center transition-all" title="Nhập bằng giọng nói">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <label for="excel-input" class="bg-green-600 hover:bg-green-700 text-white p-2 rounded-lg cursor-pointer flex items-center gap-2 text-sm font-medium transition-all px-3">
                                <i class="fas fa-file-excel"></i> Excel
                            </label>
                            <input type="file" id="excel-input" accept=".xlsx, .xls" class="hidden"/>
                        </div>
                    </div>

                    <div class="relative flex-grow flex flex-col">
                        <textarea id="text-input" class="w-full h-64 p-4 bg-gray-900/50 border border-gray-600 rounded-xl text-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all custom-scrollbar resize-none text-base leading-relaxed" 
                        placeholder="💡 Mẹo AI: Bạn chỉ cần gõ (hoặc nói) tự do, không cần viết hoa.
Ví dụ:
nguyen van a 10c1 muon
tran thi b 11b2 k deo the
le van c 12a5 xe may"></textarea>
                        
                        <!-- Gợi ý nhanh -->
                        <div class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <button class="quick-add-btn text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 py-1.5 px-2 rounded border border-gray-600 transition-colors" data-text=" - Đi muộn">
                                + Đi muộn
                            </button>
                            <button class="quick-add-btn text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 py-1.5 px-2 rounded border border-gray-600 transition-colors" data-text=" - Không thẻ">
                                + Không thẻ
                            </button>
                            <button class="quick-add-btn text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 py-1.5 px-2 rounded border border-gray-600 transition-colors" data-text=" - Trang phục">
                                + Sai phục trang
                            </button>
                             <button class="quick-add-btn text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 py-1.5 px-2 rounded border border-gray-600 transition-colors" data-text=" - Xe máy">
                                + Xe phân khối
                            </button>
                        </div>
                    </div>

                    <div class="mt-6">
                        <button id="process-btn" class="w-full group bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 px-6 rounded-xl text-lg transition-all shadow-lg shadow-blue-600/20 flex items-center justify-center gap-3">
                            <i class="fas fa-magic group-hover:animate-pulse"></i>
                            Xử Lý & Chuẩn Hóa Tự Động
                        </button>
                        <p class="text-xs text-center text-gray-500 mt-2 italic">*Hệ thống sẽ tự động viết hoa Tên và Lớp chuẩn xác.</p>
                    </div>
                </div>
            </div>

            <!-- Cột Phải: Kết quả (chiếm 7 phần) -->
            <div class="lg:col-span-7 space-y-6">
                <div class="bg-gray-800/80 backdrop-blur-sm p-6 rounded-2xl shadow-xl border border-gray-700 h-full flex flex-col">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                        <h2 class="text-xl font-bold text-white flex items-center gap-2">
                            <i class="fas fa-list-alt text-green-400"></i> Danh Sách Vi Phạm
                        </h2>
                        
                        <!-- Toolbar Actions -->
                        <div id="action-toolbar" class="flex gap-2 opacity-50 pointer-events-none transition-opacity duration-300">
                             <button id="undo-btn" class="bg-gray-700 hover:bg-gray-600 text-white w-9 h-9 rounded-lg flex items-center justify-center transition-colors" title="Hoàn tác (Undo)">
                                <i class="fas fa-undo"></i>
                            </button>
                            <button id="edit-mode-btn" class="bg-yellow-600 hover:bg-yellow-700 text-white w-9 h-9 rounded-lg flex items-center justify-center transition-colors" title="Chế độ chỉnh sửa">
                                <i class="fas fa-edit"></i>
                            </button>
                            <div class="h-9 w-[1px] bg-gray-600 mx-1"></div>
                            <button id="export-img-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2 shadow-lg shadow-blue-600/20 transition-all">
                                <i class="fas fa-image"></i> Ảnh
                            </button>
                            <button id="export-excel-btn" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2 shadow-lg shadow-green-600/20 transition-all">
                                <i class="fas fa-file-export"></i> Excel
                            </button>
                        </div>
                    </div>

                    <!-- Khu vực hiển thị kết quả -->
                    <div class="flex-grow bg-gray-900/50 rounded-xl border border-gray-600 overflow-hidden relative min-h-[400px]">
                        <div id="report-output" class="absolute inset-0 overflow-y-auto custom-scrollbar p-4">
                            <!-- Placeholder -->
                            <div class="h-full flex flex-col items-center justify-center text-gray-500 opacity-60">
                                <i class="fas fa-clipboard-list text-6xl mb-4"></i>
                                <p>Chưa có dữ liệu vi phạm.</p>
                                <p class="text-sm">Nhập dữ liệu và nhấn nút Xử Lý.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Edit Mode Controls (Hidden by default) -->
                    <div id="edit-controls" class="hidden mt-4 pt-4 border-t border-gray-700 flex justify-end gap-3 animate-fade-in">
                        <span class="text-yellow-400 text-sm flex items-center mr-auto"><i class="fas fa-exclamation-triangle mr-2"></i>Đang trong chế độ sửa</span>
                        <button id="cancel-edit-btn" class="bg-gray-600 hover:bg-gray-500 text-white px-4 py-2 rounded-lg text-sm font-bold">Hủy</button>
                        <button id="save-edit-btn" class="bg-yellow-600 hover:bg-yellow-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg">Lưu Thay Đổi</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Thông Báo -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="bg-gray-800 border-l-4 border-blue-500 text-white px-6 py-4 rounded shadow-2xl flex items-center gap-3">
            <i id="toast-icon" class="fas fa-info-circle text-blue-400 text-xl"></i>
            <div>
                <h4 id="toast-title" class="font-bold text-sm">Thông báo</h4>
                <p id="toast-message" class="text-sm text-gray-300">Nội dung thông báo</p>
            </div>
        </div>
    </div>
    
    <!-- Spinner loading -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/50 z-[60] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-gray-800 p-6 rounded-xl shadow-2xl flex flex-col items-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-white mb-3"></div>
            <p class="text-white">Đang xử lý...</p>
        </div>
    </div>

    <!-- Thư viện JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- File Script riêng -->
    <script src="script.js"></script>
</body>
</html>
